<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#09090b; font-family:'Inter', sans-serif;">
  <defs>
    <pattern id="grid-gyro-cube" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#27272a"/>
    </pattern>
    <radialGradient id="spot-gyro-cube" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="grad-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="grad-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="grad-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#spot-gyro-cube)"/>
  <rect width="1200" height="900" fill="url(#grid-gyro-cube)"/>
  <text x="60" y="70" fill="#f97316" font-size="12" font-weight="700" letter-spacing="2">WAVEZLY // KINETIC GADGETS & FIDGET ENGINEERING</text>
  <text x="1140" y="70" text-anchor="end" fill="#71717a" font-size="11">SKU: WV-GYRO-DUALAXIS</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="#27272a" stroke-width="1"/>
  <text x="60" y="125" fill="#f4f4f5" font-size="24" font-weight="800" letter-spacing="-0.5">DUAL-AXIS KINETIC GYRO CUBE</text>
  <text x="60" y="148" fill="#a1a1aa" font-size="12" letter-spacing="1">01 // TRIPLE GIMBAL CONCENTRIC ROTATION</text>

  <!-- Gyro Cube Mechanism -->
  <g transform="translate(600, 480)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="180" rx="190" ry="35" fill="#000000" opacity="0.6"/>

    <!-- Outer Gimbal Ring (Elliptical view) -->
    <ellipse cx="0" cy="0" rx="160" ry="160" fill="none" stroke="url(#grad-steel)" stroke-width="18"/>
    <ellipse cx="0" cy="0" rx="160" ry="160" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Outer Gimbal Pivot Pins -->
    <circle cx="0" cy="-160" r="10" fill="#f97316" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="160" r="10" fill="#f97316" stroke="#fff" stroke-width="2"/>

    <!-- Intermediate Gimbal Ring (Rotated 45deg projection) -->
    <g transform="rotate(40)">
      <ellipse cx="0" cy="0" rx="120" ry="90" fill="none" stroke="url(#grad-brass)" stroke-width="14"/>
      <circle cx="-120" cy="0" r="7" fill="#cbd5e1"/>
      <circle cx="120" cy="0" r="7" fill="#cbd5e1"/>
    </g>

    <!-- Innermost Gimbal Ring (Rotated opposite) -->
    <g transform="rotate(-35)">
      <ellipse cx="0" cy="0" rx="85" ry="60" fill="none" stroke="url(#grad-orange)" stroke-width="12"/>
      <circle cx="0" cy="-60" r="6" fill="#cbd5e1"/>
      <circle cx="0" cy="60" r="6" fill="#cbd5e1"/>
    </g>

    <!-- Core Floating Isometric Cube -->
    <g transform="translate(0, 0)">
      <!-- Top Face -->
      <polygon points="0,-40 35,-20 0,0 -35,-20" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/>
      <!-- Left Face -->
      <polygon points="-35,-20 0,0 0,40 -35,20" fill="#ea580c" stroke="#f97316" stroke-width="1.5"/>
      <!-- Right Face -->
      <polygon points="0,0 35,-20 35,20 0,40" fill="#c2410c" stroke="#f97316" stroke-width="1.5"/>
      <!-- Inner Core Glow -->
      <circle cx="0" cy="0" r="6" fill="#fff" opacity="0.9"/>
    </g>

    <!-- Motion Lines -->
    <path d="M -180 -40 A 200 200 0 0 1 -130 -140" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
    <path d="M 180 40 A 200 200 0 0 1 130 140" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="6 6" opacity="0.7"/>
  </g>
  <text x="600" y="740" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="monospace">ZERO-FRICTION BALL BEARING CHANNELS • PRINT-IN-PLACE GIMBAL</text>
</svg>
