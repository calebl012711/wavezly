<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#09090b; font-family:'Inter', sans-serif;">
  <defs>
    <pattern id="grid-low-poly-planter" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#27272a"/>
    </pattern>
    <radialGradient id="spot-low-poly-planter" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="facet-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="succulent-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#spot-low-poly-planter)"/>
  <rect width="1200" height="900" fill="url(#grid-low-poly-planter)"/>
  <text x="60" y="70" fill="#10b981" font-size="12" font-weight="700" letter-spacing="2">WAVEZLY // HOME DECOR & DESK BOTANICALS</text>
  <text x="1140" y="70" text-anchor="end" fill="#71717a" font-size="11">SKU: WV-PLANTER-GEOMETRIC</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="#27272a" stroke-width="1"/>
  <text x="60" y="125" fill="#f4f4f5" font-size="24" font-weight="800" letter-spacing="-0.5">LOW-POLY GEOMETRIC PLANTER</text>
  <text x="60" y="148" fill="#a1a1aa" font-size="12" letter-spacing="1">01 // MATTE BIOPOLYMER FACETED ARCHITECTURE</text>

  <!-- Planter Illustration -->
  <g transform="translate(600, 480)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="180" rx="200" ry="35" fill="#000000" opacity="0.6"/>

    <!-- Succulent Leaves coming out of top -->
    <g transform="translate(0, -90)">
      <path d="M 0 0 C -40 -60 -80 -70 -100 -40 C -80 -10 -40 20 0 20 Z" fill="url(#succulent-green)" stroke="#047857"/>
      <path d="M 0 0 C 40 -60 80 -70 100 -40 C 80 -10 40 20 0 20 Z" fill="url(#succulent-green)" stroke="#047857"/>
      <path d="M 0 10 C -25 -80 -50 -120 0 -130 C 50 -120 25 -80 0 10 Z" fill="url(#succulent-green)" stroke="#047857"/>
      <path d="M 0 5 C -20 -40 -50 -50 -60 -20 C -40 0 -20 15 0 15 Z" fill="#6ee7b7" stroke="#059669"/>
      <path d="M 0 5 C 20 -40 50 -50 60 -20 C 40 0 20 15 0 15 Z" fill="#6ee7b7" stroke="#059669"/>
    </g>

    <!-- Low-Poly Facets Planter Vessel -->
    <!-- Top Rim Facets -->
    <polygon points="-120,-80 0,-110 120,-80 70,-40 -70,-40" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Front Upper Facets -->
    <polygon points="-120,-80 -160,20 -70,-40" fill="url(#facet-mid)" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="-70,-40 -160,20 -80,50" fill="url(#facet-dark)" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="-70,-40 -80,50 0,0" fill="url(#facet-light)" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="-70,-40 0,0 70,-40" fill="url(#facet-mid)" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="70,-40 0,0 80,50" fill="url(#facet-light)" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="70,-40 80,50 160,20" fill="url(#facet-dark)" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="70,-40 160,20 120,-80" fill="url(#facet-mid)" stroke="#10b981" stroke-width="1.5"/>

    <!-- Front Lower Facets -->
    <polygon points="-160,20 -100,160 -80,50" fill="url(#facet-dark)" stroke="#059669" stroke-width="1.5"/>
    <polygon points="-80,50 -100,160 0,175" fill="url(#facet-mid)" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="-80,50 0,175 0,0" fill="url(#facet-light)" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="0,0 0,175 80,50" fill="url(#facet-mid)" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="80,50 0,175 100,160" fill="url(#facet-light)" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="80,50 100,160 160,20" fill="url(#facet-dark)" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="600" y="740" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="monospace">ORIGAMI VORONOI FACET GEOMETRY • INTEGRATED DRAINAGE BASIN</text>
</svg>
