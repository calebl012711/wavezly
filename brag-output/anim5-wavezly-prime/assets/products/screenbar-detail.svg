<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#09090b; font-family:'Inter', sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid-screenbar-detail" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#27272a"/>
    </pattern>
    <!-- Radial Spotlight -->
    <radialGradient id="spot-screenbar-detail" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f1f23" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <!-- Linear Product Gradient -->
    <linearGradient id="bodyGrad-screenbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c31"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#101012"/>
    </linearGradient>
    <filter id="shadow-screenbar" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="900" fill="url(#spot-screenbar-detail)"/>
  <rect width="1200" height="900" fill="url(#grid-screenbar-detail)"/>

  <!-- Technical Frame & Crop Marks -->
  <g stroke="#3f3f46" stroke-width="1" opacity="0.6">
    <path d="M 40 60 L 40 40 L 60 40"/>
    <path d="M 1160 60 L 1160 40 L 1140 40"/>
    <path d="M 40 840 L 40 860 L 60 860"/>
    <path d="M 1160 840 L 1160 860 L 1140 860"/>
    <line x1="600" y1="40" x2="600" y2="55" stroke-dasharray="3,3"/>
    <line x1="600" y1="845" x2="600" y2="860" stroke-dasharray="3,3"/>
    <line x1="40" y1="450" x2="55" y2="450" stroke-dasharray="3,3"/>
    <line x1="1145" y1="450" x2="1160" y2="450" stroke-dasharray="3,3"/>
  </g>

  <!-- Header Telemetry Readouts -->
  <text x="60" y="70" fill="#0284c7" font-size="12" font-weight="700" letter-spacing="2">SNUGDESK // GLARE-FREE DESK LIGHT</text>
  <text x="1140" y="70" text-anchor="end" fill="#71717a" font-size="11">SKU: SD-SCREENBAR</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="#27272a" stroke-width="1"/>

  <!-- Product Name Banner -->
  <text x="60" y="125" fill="#f4f4f5" font-size="24" font-weight="800" font-family="'Space Grotesk', sans-serif" letter-spacing="-0.5">ASYMMETRIC DESK SCREENBAR</text>
  <text x="60" y="148" fill="#a1a1aa" font-size="12" letter-spacing="1">03 // MATERIAL & TEXTURE MACRO</text>

  <!-- ================= VARIANT GRAPHICS ================= -->
  
      <!-- Macro Texture, Layer Bonding & Infill Close-up -->
      <g transform="translate(600, 460)">
        <!-- Magnifying Circular Reticle -->
        <circle cx="0" cy="0" r="240" fill="#121216" stroke="#3f3f46" stroke-width="3"/>
        <circle cx="0" cy="0" r="230" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>

        <!-- Micro Layer Strata (0.20mm Layer Lines) -->
        <line x1="-220" y1="-170" x2="220" y2="-170" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-150" x2="220" y2="-150" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-130" x2="220" y2="-130" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-110" x2="220" y2="-110" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-90" x2="220" y2="-90" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-70" x2="220" y2="-70" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-50" x2="220" y2="-50" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-30" x2="220" y2="-30" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="-10" x2="220" y2="-10" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="10" x2="220" y2="10" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="30" x2="220" y2="30" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="50" x2="220" y2="50" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="70" x2="220" y2="70" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="90" x2="220" y2="90" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="110" x2="220" y2="110" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="130" x2="220" y2="130" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="150" x2="220" y2="150" stroke="#27272a" stroke-width="2"/>
<line x1="-220" y1="170" x2="220" y2="170" stroke="#27272a" stroke-width="2"/>

        <!-- Chamfer Cut Edge Accent -->
        <path d="M -160 -180 L 160 140" stroke="#0284c7" stroke-width="3"/>
        <circle cx="0" cy="-20" r="6" fill="#0284c7"/>

        <!-- Callout Detail Badge -->
        <rect x="50" y="-120" width="220" height="70" rx="6" fill="#18181b" stroke="#0284c7" stroke-width="1.5"/>
        <text x="65" y="-95" fill="#0284c7" font-size="10" font-weight="700">VELVET MATTE FINISH</text>
        <text x="65" y="-75" fill="#f4f4f5" font-size="12">0.20mm Ultra Detail</text>
        <text x="65" y="-60" fill="#71717a" font-size="10">Resists fingerprints & scratches</text>

        <!-- Reticle Crosshairs -->
        <line x1="-260" y1="0" x2="-230" y2="0" stroke="#71717a" stroke-width="1.5"/>
        <line x1="230" y1="0" x2="260" y2="0" stroke="#71717a" stroke-width="1.5"/>
        <line x1="0" y1="-260" x2="0" y2="-230" stroke="#71717a" stroke-width="1.5"/>
        <line x1="0" y1="230" x2="0" y2="260" stroke="#71717a" stroke-width="1.5"/>
      </g>
      

  <!-- Footer Specs & Telemetry -->
  <line x1="60" y1="810" x2="1140" y2="810" stroke="#27272a" stroke-width="1"/>
  <g fill="#71717a" font-size="11">
    <text x="60" y="835">MATERIAL: <tspan fill="#f4f4f5">CNC 6063 ANODIZED ALUMINUM</tspan></text>
    <text x="500" y="835">DIMENSIONS: <tspan fill="#f4f4f5">450 × 92 × 32 MM</tspan></text>
    <text x="1140" y="835" text-anchor="end">FULFILLMENT: <tspan fill="#0284c7">FAST SHIP IN-STOCK (2–3 DAYS)</tspan></text>
  </g>
</svg>