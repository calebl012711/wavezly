<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#09090b; font-family:'Inter', sans-serif;">
  <defs>
    <pattern id="grid-crystal-dragon" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181b" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#27272a"/>
    </pattern>
    <radialGradient id="spot-crystal-dragon" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="grad-dragon-scales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="grad-crystal-facet" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#spot-crystal-dragon)"/>
  <rect width="1200" height="900" fill="url(#grid-crystal-dragon)"/>
  <text x="60" y="70" fill="#06b6d4" font-size="12" font-weight="700" letter-spacing="2">WAVEZLY // TRENDING 3D TOYS & ARTICULATED PRINTS</text>
  <text x="1140" y="70" text-anchor="end" fill="#71717a" font-size="11">SKU: WV-DRAGON-CRYSTAL</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="#27272a" stroke-width="1"/>
  <text x="60" y="125" fill="#f4f4f5" font-size="24" font-weight="800" letter-spacing="-0.5">ARTICULATED CRYSTAL DRAGON</text>
  <text x="60" y="148" fill="#a1a1aa" font-size="12" letter-spacing="1">01 // MULTI-SEGMENT FLEXIBLE PRINT-IN-PLACE</text>
  
  <!-- Dragon Illustration -->
  <g transform="translate(600, 480)">
    <!-- Aura glow -->
    <ellipse cx="0" cy="80" rx="360" ry="90" fill="#6366f1" opacity="0.15" filter="blur(30px)"/>
    
    <!-- Dragon Spine & Facets: Serpentine S-Curve -->
    <path d="M -340 100 Q -200 -80 -40 20 T 180 30 Q 280 80 340 30" fill="none" stroke="#4f46e5" stroke-width="28" stroke-linecap="round" opacity="0.4"/>
    <path d="M -340 100 Q -200 -80 -40 20 T 180 30 Q 280 80 340 30" fill="none" stroke="url(#grad-dragon-scales)" stroke-width="14" stroke-linecap="round"/>

    <!-- Crystal Spikes / Faceted Segments -->
    <!-- Segment 1 Tail -->
    <polygon points="-330,90 -355,50 -320,70" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="-300,70 -315,25 -285,55" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="-260,40 -270,-10 -240,25" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="-210,5 -215,-50 -185, -10" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="-150,-10 -145,-75 -120,-20" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>

    <!-- Segment 2 Body Curve -->
    <polygon points="-80,0 -70,-70 -45,-5" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="-10,15 0,-60 25,10" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="60,25 75,-45 95,20" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="130,28 150,-35 165,22" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>
    <polygon points="200,45 225,-15 235,38" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1.5"/>

    <!-- Dragon Head & Crystal Horns -->
    <g transform="translate(320, 25)">
      <!-- Head geometry -->
      <polygon points="0,15 50,0 85,-10 95,15 65,35 10,30" fill="#1e1b4b" stroke="url(#grad-dragon-scales)" stroke-width="3"/>
      <!-- Crystal Horns -->
      <polygon points="20,-5 45,-90 60,-15" fill="url(#grad-crystal-facet)" stroke="#c084fc" stroke-width="2"/>
      <polygon points="5,-5 15,-65 35,-10" fill="url(#grad-crystal-facet)" stroke="#38bdf8" stroke-width="2"/>
      <!-- Glowing Eye -->
      <polygon points="55,5 65,5 60,12" fill="#38bdf8"/>
      <!-- Snout Crystals -->
      <polygon points="75,0 100,-15 88,10" fill="url(#grad-crystal-facet)" stroke="#a5f3fc" stroke-width="1"/>
    </g>

    <!-- Articulated Ball Joints indicators -->
    <circle cx="-270" cy="50" r="7" fill="#06b6d4"/>
    <circle cx="-190" cy="0" r="8" fill="#6366f1"/>
    <circle cx="-90" cy="5" r="9" fill="#8b5cf6"/>
    <circle cx="20" cy="22" r="9" fill="#a855f7"/>
    <circle cx="140" cy="27" r="8" fill="#6366f1"/>
    <circle cx="240" cy="40" r="7" fill="#06b6d4"/>
  </g>
  <text x="600" y="740" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="monospace">VIRAL PRINT-IN-PLACE ARTICULATION • DUAL-COLOR CO-EXTRUSION</text>
</svg>
